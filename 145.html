<!doctype html>

<html lang="zh-Hant">

<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>動態海報</title>

<style>

/* =========================================================
   基本設定
========================================================= */

:root{
    --ink:#12312c;
    --ink-deep:#0a201c;
    --paper:#f3ede0;
    --gold:#c8973f;
    --jade:#4c8a76;
    --jade-soft:#a9c9bd;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--ink-deep);
}

body{
    font-family:
        "Noto Serif TC",
        "Microsoft JhengHei",
        serif;
}


/* =========================================================
   主舞台
========================================================= */

.stage{
    position:relative;

    width:100%;
    height:100vh;
    min-height:640px;

    overflow:hidden;

    background:
        radial-gradient(
            120% 90% at 20% 0%,
            #1c463f 0%,
            var(--ink) 45%,
            var(--ink-deep) 100%
        );
}


/* =========================================================
   潑墨背景
========================================================= */

.ink-blob{
    position:absolute;

    border-radius:50%;

    filter:blur(40px);

    opacity:.35;

    mix-blend-mode:screen;

    will-change:transform;
}

.ink-blob.b1{
    width:480px;
    height:480px;

    top:-120px;
    left:-100px;

    background:
        radial-gradient(
            circle,
            var(--jade) 0%,
            transparent 70%
        );

    animation:
        drift1 22s ease-in-out infinite;
}

.ink-blob.b2{
    width:380px;
    height:380px;

    top:30%;
    right:-140px;

    background:
        radial-gradient(
            circle,
            var(--gold) 0%,
            transparent 70%
        );

    opacity:.22;

    animation:
        drift2 26s ease-in-out infinite;
}

.ink-blob.b3{
    width:300px;
    height:300px;

    bottom:-80px;
    left:20%;

    background:
        radial-gradient(
            circle,
            var(--jade-soft) 0%,
            transparent 70%
        );

    opacity:.18;

    animation:
        drift3 30s ease-in-out infinite;
}

@keyframes drift1{

    0%,100%{
        transform:
            translate(0,0)
            scale(1);
    }

    50%{
        transform:
            translate(40px,30px)
            scale(1.15);
    }
}

@keyframes drift2{

    0%,100%{
        transform:
            translate(0,0)
            scale(1);
    }

    50%{
        transform:
            translate(-30px,40px)
            scale(1.1);
    }
}

@keyframes drift3{

    0%,100%{
        transform:
            translate(0,0)
            scale(1);
    }

    50%{
        transform:
            translate(20px,-25px)
            scale(1.08);
    }
}


/* =========================================================
   音樂按鈕
========================================================= */

.sound-btn{

    position:absolute;

    top:28px;
    right:118px;

    width:46px;
    height:46px;

    border:none;

    border-radius:50%;

    background:
        rgba(0,0,0,.35);

    display:flex;

    align-items:center;
    justify-content:center;

    cursor:pointer;

    z-index:30;

    transition:
        background .2s,
        transform .2s;
}

.sound-btn:hover{

    background:
        rgba(0,0,0,.55);

    transform:
        scale(1.08);
}

.sound-btn svg{

    width:22px;
    height:22px;

    fill:var(--paper);
}


/* =========================================================
   印章
========================================================= */

.seal{

    position:absolute;

    top:28px;
    right:28px;

    width:74px;
    height:74px;

    border:
        3px solid
        var(--gold);

    border-radius:10px;

    display:flex;

    align-items:center;
    justify-content:center;

    color:var(--gold);

    font-size:26px;

    font-weight:700;

    letter-spacing:2px;

    writing-mode:vertical-rl;

    background:
        rgba(200,151,63,.08);

    animation:
        sealPulse 3.2s
        ease-in-out
        infinite;

    z-index:30;
}

@keyframes sealPulse{

    0%,100%{
        box-shadow:
            0 0 0 0
            rgba(200,151,63,.35);
    }

    50%{
        box-shadow:
            0 0 0 8px
            rgba(200,151,63,0);
    }
}


/* =========================================================
   台灣地圖
========================================================= */

.taiwan-map{

    position:absolute;

    top:55px;

    right:36%;

    width:150px;

    z-index:12;

    opacity:.95;
    border:none;
    outline:none;
    background:transparent;
    isolation:isolate;

    animation:
        taiwanFloat 5s
        ease-in-out
        infinite;
}

.taiwan-map img{

    width:100%;
    height:auto;

    display:block;

    border:none;
    outline:none;
    background:transparent;

    /* GIF 若有白底，讓白色盡量融入深綠海報背景 */
    mix-blend-mode:multiply;

    filter:
        drop-shadow(
            0 8px 18px
            rgba(0,0,0,.55)
        );

    border-radius:10px;
}

.taiwan-label{

    margin-top:6px;

    text-align:center;

    color:var(--gold);

    font-size:14px;

    font-weight:700;

    letter-spacing:3px;
}

@keyframes taiwanFloat{

    0%,100%{
        transform:
            translateY(0)
            scale(1);
    }

    50%{
        transform:
            translateY(-10px)
            scale(1.04);
    }
}


/* =========================================================
   人物照片
========================================================= */

.portrait-wrap{

    position:absolute;

    right:4%;
    bottom:0;

    height:88%;

    max-height:780px;

    z-index:8;

    -webkit-mask-image:
        linear-gradient(
            to top,
            black 78%,
            transparent 100%
        );

    mask-image:
        linear-gradient(
            to top,
            black 78%,
            transparent 100%
        );
}

.portrait-wrap img{

    height:100%;
    width:auto;

    display:block;

    object-fit:contain;
    border:none;
    outline:none;
    background:transparent;

    filter:
        drop-shadow(
            0 20px 40px
            rgba(0,0,0,.45)
        );

    animation:
        floatSlow 6s
        ease-in-out
        infinite;
}

@keyframes floatSlow{

    0%,100%{
        transform:
            translateY(0);
    }

    50%{
        transform:
            translateY(-10px);
    }
}


/* =========================================================
   地點照片
========================================================= */

.place{

    position:absolute;

    top:70px;
    right:54%;

    width:250px;
    height:250px;

    z-index:10;

    overflow:hidden;

    border:
        4px solid
        var(--gold);

    border-radius:16px;

    background:#000;

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.45);

    animation:
        placeFloat 5s
        ease-in-out
        infinite;
}

.place img{

    width:100%;
    height:100%;

    object-fit:cover;

    display:block;
}

@keyframes placeFloat{

    0%,100%{
        transform:
            translateY(0)
            rotate(0deg);
    }

    50%{
        transform:
            translateY(-8px)
            rotate(.8deg);
    }
}


/* =========================================================
   標題
========================================================= */

.headline{

    position:absolute;

    left:6%;
    top:12%;

    z-index:15;

    color:var(--paper);

    opacity:0;

    animation:
        fadeUp 1.1s
        ease-out
        .3s
        forwards;
}

.headline .name{

    font-size:
        clamp(
            40px,
            7vw,
            76px
        );

    font-weight:900;

    line-height:1.15;

    letter-spacing:4px;

    writing-mode:vertical-rl;

    border-left:
        4px solid
        var(--gold);

    padding-left:14px;
}

.headline .role{

    margin-top:14px;

    font-size:15px;

    color:var(--jade-soft);

    letter-spacing:2px;

    line-height:1.8;
}


/* =========================================================
   底部文字
========================================================= */

.tagline{

    position:absolute;

    left:6%;
    bottom:9%;

    z-index:15;

    color:var(--paper);

    max-width:60%;

    opacity:0;

    animation:
        fadeUp 1.1s
        ease-out
        .8s
        forwards;
}

.tagline .big{

    font-size:
        clamp(
            20px,
            3vw,
            30px
        );

    font-weight:700;

    line-height:1.6;
}

.tagline .small{

    margin-top:10px;

    font-size:14px;

    color:var(--jade-soft);

    letter-spacing:1px;
}

@keyframes fadeUp{

    from{
        opacity:0;

        transform:
            translateY(18px);
    }

    to{
        opacity:1;

        transform:
            translateY(0);
    }
}


/* =========================================================
   城市剪影
========================================================= */

.skyline{

    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:22%;

    z-index:2;

    overflow:hidden;
}

.skyline svg{

    position:absolute;

    bottom:0;
    left:0;

    width:140%;
    height:100%;

    animation:
        cityDrift 40s
        linear
        infinite;
}

@keyframes cityDrift{

    from{
        transform:
            translateX(0);
    }

    to{
        transform:
            translateX(-30%);
    }
}


/* =========================================================
   車子
========================================================= */

.car{

    position:absolute;

    bottom:6%;
    left:-100px;

    z-index:12;

    animation:
        carRun 9s
        linear
        infinite;
}

@keyframes carRun{

    from{
        left:-100px;
    }

    to{
        left:105%;
    }
}


/* =========================================================
   捷運
========================================================= */

.mrt{

    position:absolute;

    bottom:15%;
    right:-220px;

    z-index:12;

    animation:
        mrtRun 13s
        linear
        infinite;
}

@keyframes mrtRun{

    from{
        right:-220px;
    }

    to{
        right:105%;
    }
}


/* =========================================================
   底部浮水印
========================================================= */

.watermark{

    position:absolute;

    left:50%;

    bottom:2%;

    transform:
        translateX(-50%);

    z-index:20;

    color:
        rgba(243,237,224,.45);

    font-size:11px;

    letter-spacing:1px;

    white-space:nowrap;
}


/* =========================================================
   手機版
========================================================= */

    .headline .role{

    .tagline .small{

    .portrait-wrap{

        right:-4%;

    }

    .place{

        width:130px;

        top:90px;

    .taiwan-map{

        width:90px;

        top:240px;

    .taiwan-label{

    }

    .sound-btn{

    }

    .seal{

    }

    .skyline{

        height:17%;
    }

    .watermark{

        font-size:9px;
    }
}


/* =========================================================
   減少動畫
========================================================= */

@media(prefers-reduced-motion:reduce){

    .ink-blob,
    .portrait-wrap img,
    .place,
    .taiwan-map,
    .skyline svg,
    .car,
    .mrt,
    .seal{

        animation:none !important;
    }
}

</style>

<script>

/* =========================================================
   背景音樂
========================================================= */

const bgm =
    document.getElementById("bgm");

const soundBtn =
    document.getElementById("soundBtn");

const iconOn =
    document.getElementById("iconOn");

const iconOff =
    document.getElementById("iconOff");


let started = false;


/* =========================================================
   更新音樂圖示
========================================================= */

function showPlaying(isPlaying){

    iconOn.style.display =
        isPlaying
            ? "block"
            : "none";

    iconOff.style.display =
        isPlaying
            ? "none"
            : "block";
}


/* =========================================================
   嘗試自動播放
   手機瀏覽器通常會阻擋自動播放，
   所以失敗是正常的。
========================================================= */

bgm.play()

.then(() => {

    started = true;

    showPlaying(true);

})

.catch(() => {

    started = false;

    showPlaying(false);

});


/* =========================================================
   點擊音樂按鈕
========================================================= */

soundBtn.addEventListener(
    "click",
    async () => {

        try{

            if(bgm.paused){

                await bgm.play();

                started = true;

                showPlaying(true);

            }else{

                bgm.pause();

                started = false;

                showPlaying(false);

            }

        }catch(error){

            console.error(
                "音樂播放失敗:",
                error
            );

            showPlaying(false);
        }

    }
);


/* =========================================================
   第一次觸碰畫面時嘗試播放
   對手機比較友善
========================================================= */

document.addEventListener(
    "pointerdown",
    async () => {

        if(!started){

            try{

                await bgm.play();

                started = true;

                showPlaying(true);

            }catch(error){

                /* 瀏覽器阻擋播放時不報錯 */

            }

        }

    },
    {
        once:true
    }
);
